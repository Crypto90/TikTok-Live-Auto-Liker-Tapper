name: Build Multi-Platform Standalone Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TikTokLiveAutoLiker-Windows
            asset_path: dist/TikTokLiveAutoLiker.exe
          - os: macos-latest
            artifact_name: TikTokLiveAutoLiker-macOS
            asset_path: dist/TikTokLiveAutoLiker-macOS.zip
          - os: ubuntu-22.04
            artifact_name: TikTokLiveAutoLiker-Linux
            asset_path: dist/TikTokLiveAutoLiker-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1-mesa-glx libegl1-mesa

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable
        run: |
          python build.py

      - name: Package macOS App Bundle into Zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y TikTokLiveAutoLiker-macOS.zip TikTokLiveAutoLiker.app Open_TikTokLiveAutoLiker.command

      - name: Package Linux Binary into Tarball
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf TikTokLiveAutoLiker-Linux.tar.gz TikTokLiveAutoLiker

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List Release Files
        run: ls -lh release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v1.1.4 - Unthrottled Background Auto-Tapping & Multi-Tab Performance"
          body_path: RELEASE_NOTES.md
          files: |
            release_assets/TikTokLiveAutoLiker.exe
            release_assets/TikTokLiveAutoLiker-macOS.zip
            release_assets/TikTokLiveAutoLiker-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
