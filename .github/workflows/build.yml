name: Build Multi-Platform Standalone Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TikTokLiveAutoLiker-Windows
            asset_path: dist/TikTokLiveAutoLiker.exe
          - os: macos-latest
            artifact_name: TikTokLiveAutoLiker-macOS
            asset_path: dist/TikTokLiveAutoLiker-macOS.zip
          - os: ubuntu-22.04
            artifact_name: TikTokLiveAutoLiker-Linux
            asset_path: dist/TikTokLiveAutoLiker

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1-mesa-glx libegl1-mesa

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable
        run: |
          python build.py

      - name: Package macOS App Bundle into Zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y TikTokLiveAutoLiker-macOS.zip TikTokLiveAutoLiker.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
